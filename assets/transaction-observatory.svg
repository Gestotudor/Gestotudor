<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Uğur Özbek — Backend Engineer, transaction observatory">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".52" stop-color="#09192b"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54f3c2"/><stop offset="1" stop-color="#43b9ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#38e6c4" stop-opacity=".14"/><stop offset="1" stop-color="#38e6c4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#35536b" stroke-opacity=".19" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <style>
    .mono{font-family:Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,Arial,sans-serif}
    .dash{stroke-dasharray:6 9;animation:move 12s linear infinite}
    .packet{animation:travel 7s linear infinite;offset-path:path('M 698 206 C 750 206 760 142 828 142 S 904 142 952 142 S 1037 206 1085 206');offset-distance:0%}
    .packet2{animation:travel 7s linear infinite 2.4s;offset-path:path('M 698 206 C 750 206 760 142 828 142 S 904 142 952 142 S 1037 206 1085 206');offset-distance:0%}
    .packet3{animation:travel 7s linear infinite 4.8s;offset-path:path('M 698 206 C 750 206 760 142 828 142 S 904 142 952 142 S 1037 206 1085 206');offset-distance:0%}
    .pulse{animation:pulse 2.8s ease-in-out infinite}.blink{animation:blink 2.4s ease-in-out infinite}
    @keyframes move{to{stroke-dashoffset:-180}}@keyframes travel{to{offset-distance:100%}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/><rect width="1200" height="420" rx="22" fill="url(#grid)"/>
<circle cx="910" cy="174" r="250" fill="url(#glow)"/>
